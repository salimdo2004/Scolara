<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scolara - Connexion</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:100%;
            max-width:1000px;
            padding:40px 20px;
        }

        h1{
            text-align:center;
            color:#222;
            font-size:38px;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:50px;
            font-size:17px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:25px;
        }

        .card{
            background:white;
            padding:40px 25px;
            border-radius:18px;
            text-align:center;
            cursor:pointer;
            text-decoration:none;
            color:#222;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 35px rgba(0,0,0,.15);
        }

        .icon{
            font-size:55px;
            margin-bottom:20px;
        }

        .card h2{
            margin-bottom:12px;
            font-size:22px;
        }

        .card p{
            color:#666;
            font-size:15px;
        }

        .login-button{
            display:inline-block;
            margin-top:25px;
            padding:11px 25px;
            background:#2563eb;
            color:white;
            border-radius:8px;
            font-size:14px;
        }

        @media(max-width:800px){

            .cards{
                grid-template-columns:1fr;
            }

            h1{
                font-size:30px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <h1>Bienvenue sur Scolara</h1>

    <p class="subtitle">
        Choisissez votre profil pour vous connecter
    </p>


    <div class="cards">


        <!-- ETUDIANT -->

        <a href="{% url 'student_login' %}" class="card">

            <div class="icon">
                👨‍🎓
            </div>

            <h2>Étudiant</h2>

            <p>
                Accéder à votre espace étudiant
            </p>

            <span class="login-button">
                Se connecter
            </span>

        </a>


        <!-- PARENT -->

        <a href="{% url 'parent_login' %}" class="card">

            <div class="icon">
                👨‍👩‍👧
            </div>

            <h2>Parent</h2>

            <p>
                Accéder à votre espace parent
            </p>

            <span class="login-button">
                Se connecter
            </span>

        </a>


        <!-- STAFF -->

        <a href="{% url 'staff_login' %}" class="card">

            <div class="icon">
                🏫
            </div>

            <h2>Directeur / Staff</h2>

            <p>
                Accéder à l'administration
            </p>

            <span class="login-button">
                Se connecter
            </span>

        </a>


    </div>

</div>

</body>
</html>
