<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajouter Staff | Scolara</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#2563eb,#0f172a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.container{

    width:100%;
    max-width:700px;

    background:white;

    border-radius:20px;

    box-shadow:0 20px 60px rgba(0,0,0,.25);

    overflow:hidden;

}

.header{

    background:#1e40af;

    color:white;

    text-align:center;

    padding:30px;

}

.header h2{

    font-size:30px;

    margin-bottom:10px;

}

.header p{

    opacity:.9;

}

form{

    padding:35px;

}

.grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}

.form-group{

    display:flex;

    flex-direction:column;

}

.form-group.full{

    grid-column:1/3;

}

label{

    margin-bottom:8px;

    font-weight:600;

    color:#334155;

}

input,
select{

    padding:14px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:.3s;

}

input:focus,
select:focus{

    border-color:#2563eb;

    box-shadow:0 0 10px rgba(37,99,235,.2);

}

.btn{

    margin-top:30px;

    width:100%;

    background:#2563eb;

    color:white;

    border:none;

    padding:15px;

    border-radius:12px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.btn:hover{

    background:#1d4ed8;

    transform:translateY(-2px);

}

.footer{

    text-align:center;

    padding:25px;

    border-top:1px solid #e2e8f0;

}

.footer a{

    text-decoration:none;

    color:#2563eb;

    font-weight:600;

}

.footer a:hover{

    color:#1d4ed8;

}

.school{

    background:#eff6ff;

    color:#1e3a8a;

    padding:12px;

    border-radius:10px;

    margin-bottom:25px;

    text-align:center;

    font-weight:600;

}

@media(max-width:700px){

.grid{

grid-template-columns:1fr;

}

.form-group.full{

grid-column:auto;

}

}

.password-box{
    position:relative;
}

.password-box input{
    width:100%;
    padding:14px 45px 14px 14px;
}
.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:20px;
    user-select:none;
    color:#64748b;
}

.toggle-password:hover{
    color:#2563eb;
}
.error-message{
    margin-top:10px;
    padding:12px;
    background:#fee2e2;
    color:#b91c1c;
    border:1px solid #fecaca;
    border-radius:10px;
    font-size:14px;
    font-weight:500;
}
</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>👨‍💼 Ajouter un membre du Staff</h2>

<p>Plateforme de Gestion Scolaire Scolara</p>

</div>

<form method="POST">

{% csrf_token %}

<div class="school">

🏫 École : <strong>{{ school.school_name }}</strong>

</div>

<div class="grid">

<div class="form-group">

<label>ID Employé</label>

<input
type="text"
name="employee_id"
placeholder="EMP001"
required>
    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}
</div>

<div class="form-group">

<label>Fonction</label>

<select name="role" required>

<option value="">Choisir...</option>

<option value="SECRETARY">
Secrétaire
</option>

<option value="ACCOUNTANT">
Comptable
</option>

<option value="SUPERVISOR">
Surveillant
</option>

<option value="ADMIN">
Administrateur
</option>

</select>

</div>

<div class="form-group full">

<label>Nom complet</label>

<input
type="text"
name="full_name"
placeholder="Nom complet"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
name="email"
placeholder="email@scolara.com"
required>

</div>

<div class="form-group">
    <label>Téléphone</label>

    <div style="display:flex; gap:10px;">

        <select name="country_code" required style="width:120px;">
            <option value="+212">🇲🇦 +212</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+32">🇧🇪 +32</option>
            <option value="+34">🇪🇸 +34</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+39">🇮🇹 +39</option>
        </select>

        <input
            type="tel"
            name="phone"
            placeholder="612345678"
            required
            style="flex:1;">
    </div>
</div>

<div class="form-group full">


    <label>Mot de passe</label>



    <div class="password-box">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="********"
            required>

        <span class="toggle-password" onclick="togglePassword()">
            👁️
        </span>

    </div>



</div>

</div>

<button class="btn" type="submit">

➕ Ajouter le membre du Staff

</button>

</form>

<div class="footer">

<a href="{% url 'create_teacher' school.id %}">
➡ Continuer vers l'ajout des professeurs
</a>

</div>

</div>
<script>

function togglePassword() {

    const password = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");

    if (password.type === "password") {
        password.type = "text";
        icon.textContent = "🙈";
    } else {
        password.type = "password";
        icon.textContent = "👁️";
    }

}

</script>
</body>
</html>
