<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scolara - Connexion Étudiant</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-container{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.icon{
    text-align:center;
    font-size:55px;
    margin-bottom:15px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#2563eb;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
}

.error{
    background:#ffe5e5;
    color:#d00000;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
}

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:#2563eb;
    text-decoration:none;
    font-size:14px;
}

.register-link a:hover{
    text-decoration:underline;
}


</style>

</head>

<body>

<div class="login-container">

    <div class="icon">
        👨‍🎓
    </div>

    <h1>Connexion Étudiant</h1>

    <p class="subtitle">
        Connectez-vous à votre espace étudiant
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>ID Étudiant</label>

            <input
                type="text"
                name="student_id"
                placeholder="Ex: CAS-2026-0001"
                required>

        </div>


        <div class="form-group">

            <label>Mot de passe</label>

            <div class="password-box">

                <input
                    id="studentPassword"
                    type="password"
                    name="password"
                    placeholder="Votre mot de passe"
                    required>

                <span
                    class="toggle-password"
                    onclick="togglePassword()">

                    👁️

                </span>

            </div>

        </div>


        <button type="submit">

            Se connecter

        </button>

    </form>
  

    <a
        href="{% url 'login' %}"
        class="back">

        ← Retour

    </a>

</div>


<script>

function togglePassword(){

    const input =
        document.getElementById("studentPassword");

    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}

</script>

</body>

</html>
