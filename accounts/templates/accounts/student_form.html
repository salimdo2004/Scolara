<!DOCTYPE html>

  <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;

    background:linear-gradient(-45deg,#dbeafe,#eff6ff,#f3e8ff,#e0f2fe);

    background-size:400% 400%;

    animation:bgAnimation 15s ease infinite;

    min-height:100vh;

    padding:40px;

}

@keyframes bgAnimation{

    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}

}

.container{

    max-width:1100px;

    margin:auto;

    background:rgba(255,255,255,.85);

    backdrop-filter:blur(20px);

    border-radius:25px;

    padding:40px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.15);

    animation:fadeUp .8s ease;

}

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

h2{

font-size:35px;

font-weight:700;

text-align:center;

margin-bottom:40px;

color:#1e293b;

position:relative;

}

h2::after{

content:"";

width:90px;

height:5px;

background:#2563eb;

display:block;

margin:15px auto;

border-radius:20px;

}

h3{

margin:35px 0 20px;

color:#2563eb;

padding-bottom:10px;

border-bottom:2px solid #e5e7eb;

}

.row{

display:flex;

gap:25px;

margin-bottom:15px;

}

.row .form-group{

flex:1;

}

.form-group{

display:flex;

flex-direction:column;

margin-bottom:20px;

animation:fadeUp .7s ease;

}

label{

font-weight:600;

margin-bottom:8px;

color:#334155;

}

input,
select,
textarea{

padding:15px;

font-size:15px;

border-radius:15px;

border:2px solid #dbeafe;

background:white;

transition:.35s;

outline:none;

}

textarea{

resize:vertical;

min-height:100px;

}

input:hover,
select:hover,
textarea:hover{

border-color:#60a5fa;

}

input:focus,
select:focus,
textarea:focus{

border-color:#2563eb;

box-shadow:

0 0 0 5px rgba(37,99,235,.15);

transform:translateY(-2px);

}

button{

width:100%;

padding:18px;

border:none;

border-radius:15px;

background:linear-gradient(135deg,#2563eb,#4f46e5);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.4s;

letter-spacing:.5px;

margin-top:25px;

}

button:hover{

transform:translateY(-5px);

box-shadow:

0 20px 40px rgba(37,99,235,.35);

}

button:active{

transform:scale(.98);

}

.container:hover{

box-shadow:

0 25px 70px rgba(37,99,235,.15);

}

select{

cursor:pointer;

}

input[type=date]{

cursor:pointer;

}

::-webkit-scrollbar{

width:10px;

}

::-webkit-scrollbar-thumb{

background:#3b82f6;

border-radius:20px;

}

::-webkit-scrollbar-track{

background:#f1f5f9;

}

/* Animation des champs */

.form-group{

opacity:0;

animation:showField .7s forwards;

}

.form-group:nth-child(1){animation-delay:.1s;}
.form-group:nth-child(2){animation-delay:.2s;}
.form-group:nth-child(3){animation-delay:.3s;}
.form-group:nth-child(4){animation-delay:.4s;}
.form-group:nth-child(5){animation-delay:.5s;}

@keyframes showField{

to{

opacity:1;

transform:translateY(0);

}

from{

opacity:0;

transform:translateY(20px);

}

}

/* Responsive */

@media(max-width:900px){

.row{

flex-direction:column;

gap:0;

}

.container{

padding:25px;

}

body{

padding:15px;

}

h2{

font-size:28px;

}

}

@media(max-width:600px){

input,

font-size:14px;

padding:13px;

padding:15px;

font-size:16px;

}

h2{

font-size:24px;

}

}

</style>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const citySelect = document.getElementById("city");
    const schoolSelect = document.getElementById("school");

    citySelect.addEventListener("change", function () {

        const city = this.value;

        fetch(`/get-schools/?city=${city}`)
            .then(response => response.json())
            .then(data => {

                schoolSelect.innerHTML = "";

                if (data.length === 0) {

                    schoolSelect.innerHTML =
                        '<option value="">No school found</option>';

                    return;
                }

                schoolSelect.innerHTML =
                    '<option value="">Choose School</option>';

                data.forEach(function (school) {

                    let option = document.createElement("option");

                    option.value = school.id;
                    option.textContent = school.school_name;

                    schoolSelect.appendChild(option);

                });

            })
            .catch(error => {

                console.error(error);

                schoolSelect.innerHTML =
                    '<option value="">Error loading schools</option>';

            });

    });

});

</script>
